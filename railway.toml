[build]
builder = "dockerfile"

[deploy]
startCommand = "bash -lc 'echo Starting migrations && cd geoApp && python3 manage.py migrate --noinput || true && python3 manage.py setup_production || true && echo Migrations done && gunicorn geoApp.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 90 --graceful-timeout 30 --log-level info --access-logfile - --error-logfile -'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[environments.production]
variables = { DEBUG = "False" }
