[build]
builder = "dockerfile"

[deploy]
startCommand = "bash -lc 'echo Starting migrations && python3 geoApp/manage.py migrate --noinput || true && echo Migrations done && gunicorn --chdir /app/geoApp geoApp.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-level debug --access-logfile - --error-logfile -'"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[environments.production]
variables = { DEBUG = "False" }
